<section id="github">
  <div class="wrap">
    <div class="section-head reveal-on-scroll">
      <span class="eyebrow">GitHub Activity</span>
      <h2>Building in public</h2>
      <p>Live data pulled directly from <a href="https://github.com/buildwithayushmansingh" target="_blank" rel="noopener" data-cursor-text="Open">github.com/buildwithayushmansingh</a>.</p>
    </div>


        <h3 class="gh-subhead" id="ghContribHeading">Contributions</h3>
    <div class="gh-card reveal-on-scroll">
      <div class="gh-scroll">
        <div class="gh-months" id="ghMonths"></div>
        <div class="gh-heatmap" id="ghHeatmap">
          <div class="gh-loading">Loading activity…</div>
        </div>
      </div>
      <div class="gh-legend">
        <span>Less</span>
        <span class="gh-cell l0"></span><span class="gh-cell l1"></span><span class="gh-cell l2"></span><span class="gh-cell l3"></span><span class="gh-cell l4"></span>
        <span>More</span>
      </div>
    </div>
    <div class="gh-tooltip" id="ghTooltip" hidden></div>

    <div class="gh-stats reveal-on-scroll">
      <div class="hud-stat">
        <div class="stat-num" id="ghRepos">—</div>
        <div class="stat-label">Repositories</div>
      </div>
      <div class="hud-stat">
        <div class="stat-num">4</div>
        <div class="stat-label">Projects built</div>
      </div>
      <div class="hud-stat">
        <div class="stat-num" id="ghLangs">—</div>
        <div class="stat-label">Technologies</div>
      </div>
    </div>
  </div>
</section>
